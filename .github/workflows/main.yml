name: Postman Collection Workflow

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '30 02 * * *'      # Runs at 08:00 AM IST
    - cron: '00 14 * * *'      # Runs at 07:30 PM IST
    - cron: '00 06 * * 1-5'    # Runs at 11:30 AM IST (Mon-Fri)

jobs:
  run-postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Install Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run the Postman Collection with Newman
        run: |
          newman run "Inwarrenty-flow Collection ExternalFile.postman_collection.json" \
            -e QA.postman_environment.json \
            -d testData.csv \
            -r cli,htmlextra

            
